name: Breast Cancer Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install "dvc[s3]"

      - name: Pull DVC data
        working-directory: project
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HF_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HF_AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull

      - name: Run tests
        working-directory: project
        run: |
          PYTHONPATH=. pytest -v

      - name: Build Docker image
        working-directory: project
        run: |
          docker build -t breast-cancer-api .